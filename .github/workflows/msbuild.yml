name: Build and Release WireGuard

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 保持全局只读权限，在具体的 Release Job 中再赋予写权限
permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false # 禁用 v5 默认缓存，使用下面自定义的 cache 逻辑以保持你的习惯

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~\go\pkg\mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Install Dependencies (Windows)
        run: .\build.bat installdeps

      - name: Build All Architectures
        run: .\build.bat build

      - name: Upload amd64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-amd64
          path: ./amd64/
          retention-days: 7 # 调试产物只保留7天，节省空间
          
      # 如果你需要上传其他架构，取消下方注释即可：
      # - name: Upload arm64 artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: build-arm64
      #     path: ./arm64/
 
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 【关键修复】：仅在推送 Tag 时触发 Release 环节，避免 PR 和普通 Push 报错
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: build-amd64
          path: ./artifacts/amd64

      - name: Create Release and Upload Assets
        # 【关键升级】：替换已废弃的 actions/create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/amd64/wireguard.exe
            ./artifacts/amd64/wg.exe